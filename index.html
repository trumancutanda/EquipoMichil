<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipo Michil</title>
<meta name="theme-color" content="#14181f">
<meta name="description" content="Registro de gatos rescatados mediante el método CES (Captura, Esterilización, Suelta).">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="30" height="30">
          <ellipse cx="24" cy="30" rx="14" ry="12" fill="var(--accent)"/>
          <circle cx="12" cy="12" r="5.5" fill="var(--accent)"/>
          <circle cx="24" cy="7" r="5.5" fill="var(--accent)"/>
          <circle cx="36" cy="12" r="5.5" fill="var(--accent)"/>
          <circle cx="9" cy="24" r="5" fill="var(--accent)"/>
          <circle cx="39" cy="24" r="5" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand-name">Equipo Michil</span>
    </div>
    <button id="btn-refrescar" class="icon-btn" title="Actualizar datos" aria-label="Actualizar datos">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.09A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
    </button>
  </header>

  <main id="content" class="content"></main>

  <nav class="bottom-nav">
    <a href="#inicio" class="nav-item" data-route="inicio">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>
      <span>Inicio</span>
    </a>
    <a href="#michis" class="nav-item" data-route="michis">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
      <span>Michis</span>
    </a>
    <a href="#anadir" class="nav-item nav-item-cta" data-route="anadir">
      <span class="fab" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </span>
      <span>Añadir</span>
    </a>
    <a href="#estadisticas" class="nav-item" data-route="estadisticas">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 20V10h3v10zm6 0V4h3v16zm6 0v-7h3v7z"/></svg>
      <span>Estadísticas</span>
    </a>
  </nav>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="app.js"></script>
</body>
</html>
